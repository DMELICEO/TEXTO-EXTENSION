<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor y Exportador Multi-Formato Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-base: #0f172a;        /* Azul pizarra oscuro profundo */
            --bg-surface: #1e293b;     /* Azul superficie */
            --text-main: #f8fafc;      /* Blanco azulado de alto contraste */
            --text-muted: #94a3b8;     /* Azul grisáceo atenuado */
            --accent: #38bdf8;         /* Azul celeste brillante para resaltar */
            --accent-hover: #0ea5e9;   /* Celeste de interacción */
            --danger: #f43f5e;         /* Coral/Rojo suave para peligro */
            --border-color: #334155;   /* Bordes definidos en tono azul gris */
            --radius: 4px;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .editor-container {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .editor-container.fullscreen {
            max-width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background-color: #131e35;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
        }

        .toolbar-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], select, button {
            background-color: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="text"] {
            cursor: text;
            width: 180px;
        }

        optgroup {
            background-color: var(--bg-surface);
            color: var(--accent);
            font-style: normal;
            font-weight: bold;
        }

        option {
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        button:hover {
            border-color: #475569;
        }

        .btn-action { color: #ffffff; }
        .btn-action:hover { color: var(--accent); border-color: var(--accent); }
        
        .btn-danger { color: var(--text-muted); }
        .btn-danger:hover { color: var(--danger); border-color: var(--danger); }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: 1px solid var(--accent);
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .editor-workspace {
            flex-grow: 1;
            display: flex;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            border: none;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 1.05rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background-color: #0b0f19;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #334155; border: 2px solid var(--bg-base); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 950px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar-group { justify-content: space-between; width: 100%; }
            input[type="text"], select { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="editor-container" id="editorContainer">
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="btnOpen" class="btn-action" title="Abrir archivo desde el dispositivo">📂 Abrir</button>
                <button id="btnCopy" class="btn-action" title="Copiar todo el texto">📄 Copiar</button>
                <button id="btnPaste" class="btn-action" title="Pegar desde el portapapeles">📋 Pegar</button>
                <button id="btnClear" class="btn-danger" title="Borrar todo el contenido rápidamente">🗑️ Limpiar</button>
                <button id="btnFullscreen" class="btn-action" title="Alternar modo pantalla completa">⛶ Pantalla</button>
            </div>
            
            <div class="toolbar-group">
                <input type="text" id="filenameInput" placeholder="Nombre del archivo" value="documento">
                <select id="formatSelect">
                    <optgroup label="Texto y Documentación">
                        <option value="txt">.TXT (Texto Plano)</option>
                        <option value="md">.MD (Markdown)</option>
                        <option value="rtf">.RTF (Rich Text Format)</option>
                        <option value="pdf">.PDF (Portable Document)</option>
                        <option value="log">.LOG (Registro de Sistema)</option>
                        <option value="tex">.TEX (Documento LaTeX)</option>
                        <option value="bak">.BAK (Copia de Respaldo)</option>
                    </optgroup>
                    <optgroup label="Ofimática e Intercambio">
                        <option value="docx">.DOCX (Word Moderno)</option>
                        <option value="doc">.DOC (Word Antiguo)</option>
                        <option value="odt">.ODT (OpenDocument)</option>
                        <option value="pages">.PAGES (Apple Pages)</option>
                        <option value="csv">.CSV (Valores Separados por Comas)</option>
                    </optgroup>
                    <optgroup label="Desarrollo y Configuración">
                        <option value="json">.JSON (Estructura de Datos)</option>
                        <option value="html">.HTML (Código Web Enriquecido)</option>
                        <option value="xml">.XML (Markup Extensible)</option>
                        <option value="yaml">.YAML (Configuraciones Estructuradas)</option>
                        <option value="sql">.SQL (Sentencias de Base de Datos)</option>
                        <option value="env">.ENV (Variables de Entorno)</option>
                        <option value="ini">.INI (Inicialización/Config)</option>
                        <option value="conf">.CONF (Configuración Unix)</option>
                    </optgroup>
                    <optgroup label="Programación y Scripts">
                        <option value="js">.JS (JavaScript)</option>
                        <option value="ts">.TS (TypeScript)</option>
                        <option value="py">.PY (Python)</option>
                        <option value="css">.CSS (Hojas de Estilo)</option>
                        <option value="sh">.SH (Script Bash Linux)</option>
                        <option value="bat">.BAT (Script Batch Windows)</option>
                        <option value="psc">.PSC (Pseudocódigo PSeInt)</option>
                        <option value="java">.JAVA (Código Java)</option>
                        <option value="cpp">.CPP (Código C++)</option>
                        <option value="php">.PHP (Script PHP)</option>
                    </optgroup>
                </select>
                <button id="btnDownload" class="btn-primary">⬇️ Guardar</button>
            </div>
        </div>

        <input type="file" id="fileInput" style="display: none;">

        <div class="editor-workspace">
            <textarea id="textEditor" placeholder="Escribe, edita, abre o pega tu contenido aquí..." spellcheck="false"></textarea>
        </div>

        <div class="statusbar">
            <div>
                Palabras: <span id="wordCount" style="color: var(--accent);">0</span> | 
                Caracteres: <span id="charCount" style="color: var(--accent);">0</span> |
                Líneas: <span id="lineCount" style="color: var(--accent);">1</span>
            </div>
            <div id="saveStatus">Listo</div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('textEditor');
        const btnOpen = document.getElementById('btnOpen');
        const fileInput = document.getElementById('fileInput');
        const btnPaste = document.getElementById('btnPaste');
        const btnCopy = document.getElementById('btnCopy');
        const btnClear = document.getElementById('btnClear');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnDownload = document.getElementById('btnDownload');
        const formatSelect = document.getElementById('formatSelect');
        const filenameInput = document.getElementById('filenameInput');
        const container = document.getElementById('editorContainer');
        
        const wordCountDisplay = document.getElementById('wordCount');
        const charCountDisplay = document.getElementById('charCount');
        const lineCountDisplay = document.getElementById('lineCount');
        const saveStatus = document.getElementById('saveStatus');

        let currentFileHandle = null;

        editor.addEventListener('input', updateStats);
        
        function updateStats() {
            const text = editor.value;
            charCountDisplay.textContent = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCountDisplay.textContent = words;
            const lines = text.split('\n').length;
            lineCountDisplay.textContent = lines;
        }

        // --- SISTEMA INTELIGENTE DE DETECCIÓN DE CARACTERES ---
        async function decodificarTexto(archivo) {
            const arrayBuffer = await archivo.arrayBuffer();
            let textoDecodificado = "";
            try {
                // Intento 1: Leer como UTF-8 estricto (fatal: true hace que falle si hay caracteres extraños)
                const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                textoDecodificado = utf8Decoder.decode(arrayBuffer);
            } catch (e) {
                // Intento 2: Si falla el UTF-8, usamos Windows-1252 (ANSI) que soporta tildes y ñ correctamente
                const ansiDecoder = new TextDecoder('windows-1252');
                textoDecodificado = ansiDecoder.decode(arrayBuffer);
            }
            return textoDecodificado;
        }

        btnOpen.addEventListener('click', async () => {
            const currentExt = formatSelect.value;
            
            if ('showOpenFilePicker' in window) {
                try {
                    const options = {
                        types: [{
                            description: `Archivo .${currentExt.toUpperCase()}`,
                            accept: { '*/*': [`.${currentExt}`] }
                        }],
                        excludeAcceptAllOption: false 
                    };
                    
                    const [handle] = await window.showOpenFilePicker(options);
                    currentFileHandle = handle;
                    const file = await handle.getFile();
                    
                    // Usar decodificador inteligente
                    editor.value = await decodificarTexto(file);
                    
                    const lastDot = file.name.lastIndexOf('.');
                    const name = lastDot !== -1 ? file.name.substring(0, lastDot) : file.name;
                    const ext = lastDot !== -1 ? file.name.substring(lastDot + 1).toLowerCase() : 'txt';
                    
                    filenameInput.value = name;
                    
                    if (document.querySelector(`#formatSelect option[value="${ext}"]`)) {
                        formatSelect.value = ext;
                    }
                    
                    updateStats();
                    showStatus('Archivo vinculado y abierto');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        showStatus('Error al abrir archivo', true);
                    }
                }
            } else {
                fileInput.accept = `.${currentExt}`;
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            currentFileHandle = null; 
            
            try {
                // Usar decodificador inteligente también en móviles y navegadores antiguos
                editor.value = await decodificarTexto(file);
                
                const lastDot = file.name.lastIndexOf('.');
                const name = lastDot !== -1 ? file.name.substring(0, lastDot) : file.name;
                const ext = lastDot !== -1 ? file.name.substring(lastDot + 1).toLowerCase() : 'txt';
                
                filenameInput.value = name;
                
                if (document.querySelector(`#formatSelect option[value="${ext}"]`)) {
                    formatSelect.value = ext;
                }
                
                updateStats();
                showStatus('Archivo cargado correctamente');
                fileInput.value = ''; 
            } catch (error) {
                showStatus('Error al leer el archivo', true);
            }
        });

        btnCopy.addEventListener('click', async () => {
            if(!editor.value) return showStatus('Nada que copiar', true);
            try {
                await navigator.clipboard.writeText(editor.value);
                showStatus('Contenido copiado');
            } catch (err) {
                showStatus('Error al copiar', true);
            }
        });

        btnPaste.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + text + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + text.length;
                editor.focus();
                updateStats();
                showStatus('Texto pegado');
            } catch (err) {
                showStatus('Usa Ctrl+V / ⌘+V directamente', true);
            }
        });

        btnClear.addEventListener('click', () => {
            if (editor.value.length > 0) {
                if (confirm('¿Seguro que deseas vaciar el editor? Perderás el texto no guardado.')) {
                    editor.value = '';
                    currentFileHandle = null; 
                    editor.focus();
                    updateStats();
                    showStatus('Contenido limpiado');
                }
            }
        });

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(() => {
                    container.classList.toggle('fullscreen');
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                container.classList.add('fullscreen');
            } else {
                container.classList.remove('fullscreen');
            }
        });

        function showStatus(message, isError = false) {
            saveStatus.textContent = message;
            saveStatus.style.color = isError ? 'var(--danger)' : 'var(--accent)';
            setTimeout(() => {
                saveStatus.textContent = 'Listo';
                saveStatus.style.color = 'var(--text-muted)';
            }, 2500);
        }

        btnDownload.addEventListener('click', async () => {
            const text = editor.value;
            const format = formatSelect.value;
            let filename = filenameInput.value.trim() || 'documento';
            filename = `${filename}.${format}`;
            
            if (!text.trim() && format !== 'pdf') {
                showStatus('El editor está vacío', true);
                return;
            }

            if (currentFileHandle && currentFileHandle.name === filename) {
                try {
                    let contentToSave = text;
                    
                    if (format === 'html') {
                        if (!(text.trim().toLowerCase().startsWith('<!doc') || text.trim().toLowerCase().startsWith('<html'))) {
                            contentToSave = `<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${filenameInput.value}</title>\n<style>body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; color: #f8fafc; background-color: #0f172a; }</style>\n</head>\n<body>\n${text}\n</body>\n</html>`;
                        }
                    } else if (format === 'doc' || format === 'docx') {
                        contentToSave = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>\n<head><meta charset='utf-8'><title>${filenameInput.value}</title></head>\n<body>${text.replace(/\n/g, "<br>")}</body>\n</html>`;
                    } else if (format === 'rtf') {
                        const rtfText = text.replace(/\\/g, "\\\\").replace(/{/g, "\\{").replace(/}/g, "\\}").replace(/\n/g, "\\par\n");
                        contentToSave = `{\\rtf1\\ansi\\ansicpg1252\\deff0{\\fonttbl{\\f0\\fnil\\fcharset0 Arial;}}\n{\\colortbl ;\\red255\\green255\\blue255;}\n\\viewkind4\\uc1\\pard\\cf1\\f0\\fs24 USD\n}`;
                    } else if (format === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const margin = 15;
                        const maxWidth = doc.internal.pageSize.width - (margin * 2);
                        const lines = doc.splitTextToSize(text, maxWidth);
                        doc.setFont("courier", "normal");
                        doc.setFontSize(10);
                        let cursorY = margin + 5;
                        lines.forEach(line => {
                            if (cursorY > doc.internal.pageSize.height - margin) {
                                doc.addPage();
                                cursorY = margin + 5;
                            }
                            doc.text(line, margin, cursorY);
                            cursorY += 5;
                        });
                        contentToSave = doc.output('arraybuffer');
                    }

                    const writable = await currentFileHandle.createWritable();
                    await writable.write(contentToSave);
                    await writable.close();
                    showStatus('Archivo actualizado con éxito');
                    return; 
                } catch(e) {
                    console.error("Fallo guardado directo: ", e);
                }
            }

            try {
                switch(format) {
                    case 'pdf': exportPDF(text, filename); break;
                    case 'html': exportHTML(text, filename); break;
                    case 'doc': case 'docx': exportWord(text, filename, format); break;
                    case 'rtf': exportRTF(text, filename); break;
                    default: exportStandardText(text, filename, format); break;
                }
                showStatus('Descarga iniciada con éxito');
            } catch(e) {
                showStatus('Fallo en la conversión del formato', true);
            }
        });

        function downloadBlob(content, filename, mimeType) {
            let finalMimeType = mimeType;
            if (typeof content === 'string' && !finalMimeType.includes('charset=')) {
                finalMimeType += ';charset=utf-8';
            }
            
            const blob = new Blob([content], { type: finalMimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportStandardText(text, filename, format) {
            const mimeTypes = {
                'txt': 'text/plain',
                'md': 'text/markdown',
                'log': 'text/plain',
                'tex': 'text/x-tex',
                'bak': 'application/octet-stream',
                'csv': 'text/csv',
                'odt': 'application/vnd.oasis.opendocument.text',
                'pages': 'application/x-iwork-pages-sffpages',
                'json': 'application/json',
                'xml': 'application/xml',
                'yaml': 'application/x-yaml',
                'sql': 'application/sql',
                'env': 'text/plain',
                'ini': 'text/plain',
                'conf': 'text/plain',
                'js': 'application/javascript',
                'ts': 'application/typescript',
                'py': 'application/x-python',
                'css': 'text/css',
                'sh': 'application/x-sh',
                'bat': 'application/x-bat',
                'psc': 'text/plain',
                'java': 'text/x-java-source',
                'cpp': 'text/x-c',
                'php': 'application/x-httpd-php'
            };
            
            let mime = mimeTypes[format] || 'text/plain';
            
            if (mime === 'text/plain' && !['txt', 'log', 'env', 'ini', 'conf'].includes(format)) {
                mime = 'application/octet-stream';
            }
            
            downloadBlob(text, filename, mime);
        }

        function exportHTML(text, filename) {
            if (text.trim().toLowerCase().startsWith('<!doc') || text.trim().toLowerCase().startsWith('<html')) {
                downloadBlob(text, filename, 'text/html');
            } else {
                const fullHtml = `<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${filenameInput.value}</title>\n<style>body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; color: #f8fafc; background-color: #0f172a; }</style>\n</head>\n<body>\n${text}\n</body>\n</html>`;
                downloadBlob(fullHtml, filename, 'text/html');
            }
        }

        function exportWord(text, filename, format) {
            const fullHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>\n<head><meta charset='utf-8'><title>${filenameInput.value}</title></head>\n<body>${text.replace(/\n/g, "<br>")}</body>\n</html>`;
            const mime = format === 'docx' ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/msword';
            downloadBlob(fullHtml, filename, mime);
        }

        function exportRTF(text, filename) {
            const rtfText = text.replace(/\\/g, "\\\\").replace(/{/g, "\\{").replace(/}/g, "\\}").replace(/\n/g, "\\par\n");
            const rtfContent = `{\\rtf1\\ansi\\ansicpg1252\\deff0{\\fonttbl{\\f0\\fnil\\fcharset0 Arial;}}\n{\\colortbl ;\\red255\\green255\\blue255;}\n\\viewkind4\\uc1\\pard\\cf1\\f0\\fs24 USD\n}`;
            downloadBlob(rtfContent, filename, 'application/rtf');
        }

        function exportPDF(text, filename) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const margin = 15;
            const maxWidth = doc.internal.pageSize.width - (margin * 2);
            
            const lines = doc.splitTextToSize(text, maxWidth);
            doc.setFont("courier", "normal");
            doc.setFontSize(10);
            
            let cursorY = margin + 5;
            lines.forEach(line => {
                if (cursorY > doc.internal.pageSize.height - margin) {
                    doc.addPage();
                    cursorY = margin + 5;
                }
                doc.text(line, margin, cursorY);
                cursorY += 5;
            });
            doc.save(filename);
        }
    </script>
</body>
</html>
